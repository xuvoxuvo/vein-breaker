[workspace]
members = ["crates/vb_core", "crates/vb_game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
# Full debug info makes the Bevy debug binary exceed the Windows loader limit
# (>2 GB), so the executable cannot start. Keep it off for a runnable build.
debug = 0
strip = "debuginfo"

# Bevy's dependency tree is huge; compiling it optimized dominates the first
# build. Keep deps fast to build; our own crate still gets light optimization.
[profile.dev.package."*"]
opt-level = 0
debug = 0
